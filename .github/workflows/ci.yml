name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # release.yml runs the full suite this way when the tag's code hasn't passed yet
    inputs:
      full:
        description: Always run the full suite (skip the reuse check)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the suite when this exact code (same git tree) already passed. For
  # example: a PR passes, then merging it to main changes no file, so the push
  # to main has the same tree. Any difference in any file, tests and workflows
  # included, means a new tree, and the suite runs. Manual runs, re-runs and
  # release-triggered runs always test.
  # See "Avoiding repeat runs" in the README.
  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # to look up earlier runs
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        if: >-
          github.run_attempt == '1' && !inputs.full &&
          (github.event_name == 'push' || github.event_name == 'pull_request')
        uses: $/.github/actions/already-tested

  lint:
    needs: reuse
    if: needs.reuse.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      - name: Vendored assets match their pinned, integrity-checked upstream
        run: uv run --no-project python scripts/vendor_assets.py --check

  test:
    needs: reuse
    if: needs.reuse.outputs.passed != 'true'
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Chromium for the browser tests
        run: uv run --group dev playwright install --with-deps chromium
      - name: Run tests with coverage
        # Per-job threshold off: platform-specific branches (Windows vs POSIX) can
        # only be covered in aggregate, which the coverage job checks.
        run: uv run --group dev pytest -v -rs --cov --cov-report=term --cov-fail-under=0
        env:
          WEBMD_REQUIRE_BROWSER: "1"  # a missing browser fails the job instead of skipping the browser tests
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.${{ matrix.os }}-py${{ matrix.python }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: .coverage.${{ matrix.os }}-py${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage from all OS/Python jobs and enforce the 90% floor
        run: |
          uv run --group dev coverage combine --keep .coverage.*
          uv run --group dev coverage report --fail-under=90
          uv run --group dev coverage html -d htmlcov
          {
            echo "## Coverage (combined: Linux, macOS, Windows × Python 3.9–3.14)"
            echo
            echo '```'
            uv run --group dev coverage report --format=text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/

  build:
    needs: reuse
    if: needs.reuse.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Wheel and sdist contain the bundled assets
        run: uv run --no-project python scripts/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Install the built wheel in a clean venv (no repo on sys.path) on every OS,
  # then serve and fetch a page with only the installed package.
  install:
    needs: build
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install wheel into a clean venv and smoke-test it
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          if [ "$RUNNER_OS" = "Windows" ]; then py="$RUNNER_TEMP/smoke/Scripts/python.exe"; else py="$RUNNER_TEMP/smoke/bin/python"; fi
          cd "$RUNNER_TEMP"  # so the repo checkout can't shadow the installed package
          "$py" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  # The single required status check for merging (see "Merge protection" in the
  # README). It depends on every other job, so the branch rule never needs
  # updating when matrix entries are added or renamed. `if: always()` makes it
  # run, and fail, when a dependency fails or is skipped/cancelled. Without
  # that, a skipped gate would count as passing. The one exception: every job
  # was skipped because the reuse check found this exact code already passed.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [reuse, lint, test, coverage, build, install]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to have succeeded
        env:
          REUSE_RESULT: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.passed }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if [ "$REUSE_RESULT" = "success" ] && [ "$REUSED" = "true" ]; then
            echo "Identical code already passed CI; not re-running (see the reuse job for the run)."
            exit 0
          fi
          if [ "$(echo "$RESULTS" | jq -r 'all(. == "success")')" != "true" ]; then
            echo "::error::Not all CI jobs succeeded: $RESULTS"
            exit 1
          fi
          echo "FULL_PASS=true" >> "$GITHUB_ENV"
      # Record exactly what was tested, so identical code can skip CI later
      # (scripts/ci_already_passed.sh). Only for a real full pass, never a reuse.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FULL_PASS == 'true'
        with:
          persist-credentials: false
      - name: Write tested-tree marker
        if: env.FULL_PASS == 'true'
        id: marker
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          printf 'tree=%s\ncommit=%s\nrun=%s\nevent=%s\n' "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" > tested-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.FULL_PASS == 'true'
        with:
          name: tested-tree-${{ steps.marker.outputs.tree }}
          path: tested-tree.txt
          retention-days: 90
          overwrite: true
