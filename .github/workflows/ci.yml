name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      - name: Vendored assets match their pinned, integrity-checked upstream
        run: uv run --no-project python scripts/vendor_assets.py --check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Chromium for the browser tests
        run: uv run --group dev playwright install --with-deps chromium
      - name: Run tests with coverage
        # Per-job threshold off: platform-specific branches (Windows vs POSIX) can
        # only be covered in aggregate, which the coverage job checks.
        run: uv run --group dev pytest -v -rs --cov --cov-report=term --cov-fail-under=0
        env:
          WEBMD_REQUIRE_BROWSER: "1"  # a missing browser fails the job instead of skipping the browser tests
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.${{ matrix.os }}-py${{ matrix.python }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: .coverage.${{ matrix.os }}-py${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage from all OS/Python jobs and enforce the 90% floor
        run: |
          uv run --group dev coverage combine --keep .coverage.*
          uv run --group dev coverage report --fail-under=90
          uv run --group dev coverage html -d htmlcov
          {
            echo "## Coverage (combined: Linux, macOS, Windows × Python 3.9–3.14)"
            echo
            echo '```'
            uv run --group dev coverage report --format=text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Wheel and sdist contain the bundled assets
        run: uv run --no-project python scripts/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Install the built wheel in a clean venv (no repo on sys.path) on every OS,
  # then serve and fetch a page with only the installed package.
  install:
    needs: build
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install wheel into a clean venv and smoke-test it
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          if [ "$RUNNER_OS" = "Windows" ]; then py="$RUNNER_TEMP/smoke/Scripts/python.exe"; else py="$RUNNER_TEMP/smoke/bin/python"; fi
          cd "$RUNNER_TEMP"  # so the repo checkout can't shadow the installed package
          "$py" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  # The single required status check for merging (see "Merge protection" in the
  # README). It depends on every other job, so the branch rule never needs
  # updating when matrix entries are added or renamed. `if: always()` makes it
  # run, and fail, when a dependency fails or is skipped/cancelled. Without
  # that, a skipped gate would count as passing.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [lint, test, coverage, build, install]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to have succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if [ "$(echo "$RESULTS" | jq -r 'all(. == "success")')" != "true" ]; then
            echo "::error::Not all CI jobs succeeded: $RESULTS"
            exit 1
          fi
